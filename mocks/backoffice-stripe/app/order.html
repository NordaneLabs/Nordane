<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestellung · Nordane</title>
<link rel="stylesheet" href="app.css">
<script src="../assets/data.js"></script>
<script src="../assets/dienstplan.js"></script>
<script src="shell.js"></script>
<style>
  .tl { list-style: none; margin: 0; padding: 4px 20px 20px; }
  .tl li { position: relative; padding: 0 0 16px 26px; font-size: 13.5px; }
  .tl li::before { content: ''; position: absolute; left: 6px; top: 16px; bottom: -2px; width: 1px; background: var(--border-2); }
  .tl li:last-child::before { display: none; }
  .tl li i { position: absolute; left: 0; top: 4px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--primary-line); background: var(--card); }
  .tl li.done i { background: var(--primary-line); }
  .tl li b { color: var(--ink); font-weight: 550; display: block; }
  .tl li span { color: var(--muted); font-size: 12.5px; }
  .sum { padding: 6px 20px 18px; }
  .sum .r { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13.5px; }
  .sum .r.t { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; font-size: 16px; font-weight: 600; color: var(--ink); }
  .sum .r span { color: var(--muted); }
</style>
</head>
<body data-page="orders">
<div class="app"><div class="main"><main class="content" id="c"></main></div></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const N = NORDANE, U = UI;
  const o = N.orders.find((x) => x.id === +(U.q.get('id') || 1287)) || N.orders[0];
  const st = { 'neu': ['Neu', 'blue'], 'in Küche': ['In der Küche', 'violet'], 'bereit': ['Bereit', 'green'], 'verspätet': ['Verspätet', 'red'], 'offen': ['Offen', 'amber'], 'bezahlt': ['Bezahlt', 'green'], 'storniert': ['Storniert', ''], 'rückerstattet': ['Rückerstattet', 'amber'] };
  const net = o.total - o.vat;
  const steps = [['Bestellt', `${o.time} · ${o.channel}`, true], ['An die Küche gesendet', `${o.time} · Küchenmonitor`, o.status !== 'neu'], ['Zubereitet', o.status === 'bereit' || o.status === 'bezahlt' ? 'nach 14 Min.' : 'läuft', ['bereit', 'bezahlt', 'rückerstattet'].includes(o.status)], ['Bezahlt', o.tender ? `${o.tender}` : 'noch offen', ['bezahlt', 'rückerstattet'].includes(o.status)]];
  document.getElementById('c').innerHTML = `
  <div class="ph"><div><div class="crumb"><a href="orders.html">Bestellungen</a> › <span class="mono">#${o.id}</span></div>
    <h1 class="row" style="gap:12px">${U.esc(o.where)} <span class="pill lg ${st[o.status][1]}">${st[o.status][0]}</span></h1><p>Bestellung <span class="mono ink">#${o.id}</span> · ${o.time} Uhr · ${U.esc(o.channel)}</p></div>
    <div class="acts"><button class="btn" id="print">Beleg drucken</button><button class="btn" id="refund">Rückerstatten</button>${o.action ? `<button class="btn primary" id="act">${U.icon('check', 16)}${U.esc(o.action)}</button>` : ''}</div></div>
  <div class="grid g-main">
    <div class="stack">
      ${o.note ? `<div class="note">${U.icon('chat', 16)}<span><b>Notiz:</b> ${U.esc(o.note)}</span></div>` : ''}
      <div class="card"><div class="card-h"><h3>Positionen</h3><span class="muted small">${o.items.reduce((s, i) => s + i[1], 0)} Artikel</span></div>
        <table class="tbl"><thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num">Preis</th><th class="num">Total</th></tr></thead>
        <tbody>${o.items.map((i) => `<tr><td class="ink">${U.esc(i[0])}</td><td class="num">${i[1]}</td><td class="num">CHF ${N.chf(i[2])}</td><td class="num ink">CHF ${N.chf(i[1] * i[2])}</td></tr>`).join('')}</tbody></table>
        <div class="sum"><div class="r"><span>Netto</span><b>CHF ${N.chf(net)}</b></div><div class="r"><span>MWST ${o.vatRate} % ${o.vatRate === 2.6 ? '(über die Gasse)' : '(im Lokal)'}</span><b>CHF ${N.chf(o.vat)}</b></div>
        <div class="r t"><span style="color:var(--ink)">Total inkl. MWST</span><b>CHF ${N.chf(o.total)}</b></div></div></div>
      <div class="card"><div class="card-h"><h3>Verlauf</h3></div><ul class="tl">${steps.map((s) => `<li class="${s[2] ? 'done' : ''}"><i></i><b>${s[0]}</b><span>${U.esc(s[1])}</span></li>`).join('')}</ul></div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Details</h3></div><div class="card-b"><dl class="dl">
        <dt>Kanal</dt><dd>${U.esc(o.channel)}</dd><dt>Ort</dt><dd>${U.esc(o.where)}</dd><dt>Gast</dt><dd>${U.esc(o.guest)}</dd><dt>Gedecke</dt><dd>${o.covers}</dd>
        <dt>Zahlung</dt><dd>${o.tender || 'Noch offen'}</dd><dt>MWST-Satz</dt><dd>${o.vatRate} %</dd><dt>Kasse</dt><dd>Kasse Tresen</dd><dt>Bon</dt><dd><span class="mono">K-${o.id}-01</span></dd></dl></div></div>
      <div class="card"><div class="card-h"><h3>Alle MWST-Sätze</h3><p>So rechnet die Linde</p></div><div class="card-b small">${N.vatClasses.map((v) => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--border)"><span class="ink">${v.name}</span><span class="muted">${v.dine} % / ${v.take} %</span></div>`).join('')}</div></div>
    </div>
  </div>`;
  const a = document.getElementById('act'); if (a) a.onclick = () => { a.disabled = true; U.toast(`${o.action}: erledigt.`); };
  document.getElementById('print').onclick = () => U.toast('Beleg an Bondrucker Bar gesendet.');
  document.getElementById('refund').onclick = async () => {
    const ok = await U.confirm({ title: `Bestellung #${o.id} rückerstatten?`, body: 'Wählen Sie Betrag und Grund. Die Rückerstattung geht auf das ursprüngliche Zahlungsmittel.', extra: `<div class="stack" style="gap:12px;margin-top:8px"><label class="field"><span>Betrag</span><div class="input-wrap"><span class="pre">CHF</span><input class="input" value="${N.chf(o.total)}"></div></label><label class="field"><span>Grund</span><select class="input"><option>Gericht nicht in Ordnung</option><option>Falsch erfasst</option><option>Gast unzufrieden</option></select></label></div>`, ok: 'Rückerstatten', danger: true });
    if (ok) U.toast(`CHF ${N.chf(o.total)} rückerstattet. Im Z-Bericht vermerkt.`);
  };
});
</script>
</body>
</html>
