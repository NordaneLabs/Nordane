<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einstellungen · Nordane</title>
<link rel="stylesheet" href="app.css">
<script src="../assets/data.js"></script>
<script src="../assets/dienstplan.js"></script>
<script src="shell.js"></script>
<style>
  .slay { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
  .snav { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
  .snav a { padding: 7px 10px; border-radius: 7px; color: var(--text); font-size: 13.5px; text-decoration: none; transition: background .15s; }
  .snav a:hover { background: var(--hover); }
  .snav a[aria-current='true'] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--sh-1), inset 0 0 0 1px var(--border); }
  .sset { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding: 22px 0; border-top: 1px solid var(--border); }
  .sset:first-child { border-top: 0; padding-top: 0; }
  .sset h3 { font-size: 15px; }
  .sset p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .perm td { text-align: center; }
  .perm td:first-child, .perm th:first-child { text-align: left; }
  .perm .yes { color: var(--green); }
  @media (max-width: 1240px) { .slay { grid-template-columns: minmax(0, 1fr); } .snav { position: static; flex-direction: row; flex-wrap: wrap; } .sset { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
</style>
</head>
<body data-page="settings">
<div class="app"><div class="main"><main class="content">
  <div class="ph"><div><div class="crumb">Betrieb</div><h1>Einstellungen</h1><p>Betrieb, Geräte, Zahlungsarten und wer was darf.</p></div><div class="acts"><button class="btn primary" id="save">Änderungen speichern</button></div></div>
  <div class="slay">
    <nav class="snav" aria-label="Bereiche"><a href="#betrieb" aria-current="true">Betrieb</a><a href="#geraete">Geräte</a><a href="#zahlung">Zahlungsarten</a><a href="#rollen">Team und Rollen</a><a href="#oeffnung">Öffnungszeiten</a></nav>
    <div class="stack" id="s"></div>
  </div>
</main></div></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const N = NORDANE, U = UI, s = N.store;
  const f = (l, v, h) => `<label class="field"><span>${l}</span><input class="input" value="${U.esc(v)}">${h ? `<small>${h}</small>` : ''}</label>`;
  const ds = { online: ['Online', 'green'], offline: ['Offline', 'red'], warnung: ['Warnung', 'amber'] };
  document.getElementById('s').innerHTML = `
  <div class="card" id="betrieb"><div class="card-b" style="padding-top:22px">
    <div class="sset"><div><h3>Betrieb</h3><p>Steht auf Belegen, Rechnungen und im Z-Bericht.</p></div><div class="grid g2" style="gap:14px">${f('Name', s.name)}${f('Rechtsträger', s.legal)}${f('Strasse', s.street)}${f('PLZ und Ort', s.zip + ' ' + s.city)}${f('UID', s.uid, 'Handelsregister des Kantons St. Gallen')}${f('MWST-Nummer', s.vatNo)}</div></div>
    <div class="sset"><div><h3>Bank</h3><p>Für Auszahlungen von Karte und TWINT.</p></div><div class="grid g2" style="gap:14px">${f('IBAN', s.iban)}${f('Bank', s.bank)}</div></div>
    <div class="sset" id="oeffnung"><div><h3>Öffnungszeiten</h3><p>Steuern Tisch-QR, Online-Shop und den Bedarf im Dienstplan.</p></div><div class="grid g2" style="gap:14px">${f('Öffnungszeiten', s.hours)}${f('Ruhetag', 'Montag')}${f('Plätze', s.seats + ' Plätze an ' + s.tables + ' Tischen')}${f('Kanton für Feiertage', 'St. Gallen (SG)')}</div></div>
  </div></div>
  <div class="card" id="geraete"><div class="card-h"><div><h3>Geräte</h3><p>${N.devices.filter((d) => d.status === 'online').length} von ${N.devices.length} online</p></div><button class="btn sm">${U.icon('plus', 14)}Gerät koppeln</button></div>
    <table class="tbl"><thead><tr><th>Gerät</th><th>Typ</th><th>Zuletzt gesehen</th><th class="num">Status</th></tr></thead><tbody>${N.devices.map((d) => `<tr><td><div class="who"><span class="ico-sq">${U.icon(d.name.startsWith('Terminal') ? 'phone' : d.name.includes('drucker') ? 'file' : 'grid', 16)}</span><div><b>${U.esc(d.name)}</b>${d.issue ? `<span>${U.esc(d.issue)}</span>` : ''}</div></div></td><td>${U.esc(d.type)}</td><td>${d.seen}</td><td class="num">${U.pill(ds[d.status][0], ds[d.status][1])}</td></tr>`).join('')}</tbody></table></div>
  <div class="card" id="zahlung"><div class="card-h"><div><h3>Zahlungsarten</h3><p>Aktiv an allen Kassen</p></div></div>
    <ul class="list">${N.payments.map((p) => `<li><span class="ico-sq blue">${U.icon('bank', 16)}</span><div class="t"><b>${p.name}</b><span>${U.esc(p.detail)} · Gebühr ${p.fee}</span></div><label class="switch"><input type="checkbox" checked aria-label="${p.name} aktiv"><i></i></label></li>`).join('')}</ul></div>
  <div class="card" id="rollen"><div class="card-h"><div><h3>Team und Rollen</h3><p>Wer darf was im Backoffice und an der Kasse</p></div></div>
    <div class="tbl-wrap"><table class="tbl perm"><thead><tr><th>Recht</th><th>Geschäftsführung</th><th>Schichtleitung</th><th>Küchenchef</th><th>Team</th></tr></thead><tbody>
    ${[['Dienstplan bearbeiten und veröffentlichen', 1, 1, 1, 0], ['Anfragen bewilligen', 1, 1, 1, 0], ['Zeiten korrigieren', 1, 1, 1, 0], ['Monatsabschluss und Lohnexport', 1, 0, 0, 0], ['Rückerstattungen über CHF 50', 1, 1, 0, 0], ['Speisekarte ändern', 1, 0, 1, 0], ['Eigene Schichten und Ferien', 1, 1, 1, 1]].map((r) => `<tr><td class="ink">${r[0]}</td>${r.slice(1).map((v) => `<td>${v ? `<span class="yes" aria-label="ja">${U.icon('check', 16, 2)}</span>` : '<span class="muted" aria-label="nein">-</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  document.querySelectorAll('.snav a').forEach((a) => a.onclick = () => document.querySelectorAll('.snav a').forEach((x) => x.setAttribute('aria-current', String(x === a))));
  document.getElementById('save').onclick = () => U.toast('Einstellungen gespeichert.');
});
</script>
</body>
</html>
