<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Nordane Backoffice, finale Richtung. Demo für die Wirtschaft zur Linde, St. Gallen.">
<title>Nordane Backoffice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080d'/%3E%3Cpath d='M9 24V11M16 24V7M23 24V13' stroke='%23ff765f' stroke-width='4'/%3E%3C/svg%3E">
<!-- Every asset carries ?v= so a browser never mixes a cached old script with a new page (the cause of the blank LINIE page over http). -->
<link rel="stylesheet" href="styles.css?v=final-7">
<script>
(function(){var q=new URLSearchParams(location.search),t,p;try{t=q.get('theme')||localStorage.getItem('nbf1-theme');p=q.get('palette')||localStorage.getItem('nbf1-palette');if(q.get('theme'))localStorage.setItem('nbf1-theme',t);if(q.get('palette'))localStorage.setItem('nbf1-palette',p)}catch(e){t=q.get('theme');p=q.get('palette')}
var r=document.documentElement;r.dataset.theme=t==='dark'?'dark':'light';r.dataset.palette=p==='a'||p==='b'?p:'c';var b;try{b=q.get('bg')||localStorage.getItem('nbf1-bg');if(q.get('bg'))localStorage.setItem('nbf1-bg',b)}catch(e){b=q.get('bg')}r.dataset.bg=b==='mountains'?'mountains':'glow';})();
</script>
<script src="data.js?v=final-7" defer></script>
<script src="core.js?v=final-7" defer></script>
<script src="ui.js?v=final-7" defer></script>
<script src="views.js?v=final-7" defer></script>
<script src="app.js?v=final-7" defer></script>
<script>
window.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('app');if(a&&!a.firstChild){a.innerHTML='<div class="boot-error"><h1>Die Ansicht konnte nicht geladen werden.</h1><p>Ein Skript fehlt oder ist veraltet. Bitte neu laden (Shift + Neu laden) oder den Ordner direkt als Datei öffnen.</p></div>';}});
</script>
</head>

</html>
